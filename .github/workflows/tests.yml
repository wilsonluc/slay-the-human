# The checks that need no game: the agent's tests and the tools' tests. Building the mod needs the game's own
# assemblies, which never go in the repo, so it and every check in the real game stay manual (see the specs).
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    # tools/test.sh needs Git Bash (cygpath), like the tools themselves.
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the agent
        run: python -m pip install -e .
      - name: Agent tests
        run: python -m unittest discover -s agent/tests -t .
      - name: Tool tests
        shell: bash
        run: sh tools/test.sh

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "slay-the-human"
version = "0.0.0"
description = "An RL agent for Slay the Spire 2"
requires-python = ">=3.13"
dependencies = ["numpy==2.4.2"]

[tool.setuptools.packages.find]
include = ["agent*"]
